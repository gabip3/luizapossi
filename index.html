<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>LUIZA POSSI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000;
    --ivory: #efe8da;
    --stage-h: 100vh;
    --stage-h: 100svh;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background: var(--black);
    color-scheme: dark;
    -webkit-text-size-adjust: 100%;
  }

  body {
    background: var(--black);
    color: var(--ivory);
    font-family: "Cormorant Garamond", "Cormorant", "Didot", "Bodoni MT", "Times New Roman", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  .stage {
    position: relative;
    height: var(--stage-h);
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 6vw calc(env(safe-area-inset-bottom, 0px));
    overflow: hidden;
  }

  /* grão fino atrás de tudo */
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(at 20% 80%, #fff 1px, transparent 0px);
    background-size: 3px 3px;
    opacity: 0.055;
    mix-blend-mode: plus-lighter;
    pointer-events: none;
  }

  .word {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--ivory);
    opacity: 0;
    transition: opacity 2.4s cubic-bezier(.2,.6,.2,1);
  }
  .line {
    display: block;
    font-weight: 300;
    font-size: 22vw; /* ajustado por JS: as duas linhas na mesma largura */
    line-height: 0.96;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .word.is-ready { opacity: 1; animation: breathe 7s ease-in-out 2.4s infinite; }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.86; }
  }

  .soon {
    position: relative;
    margin-top: 7vw;
    font-size: clamp(12px, 3.6vw, 15px);
    font-weight: 500;
    letter-spacing: 0.46em;
    text-indent: 0.46em;
    text-transform: uppercase;
    color: rgba(239, 232, 218, 0.62);
    opacity: 0;
    transition: opacity 1.8s ease 1.2s;
  }
  .soon.is-ready { opacity: 1; }

  .social {
    position: relative;
    display: flex;
    gap: 4vw;
    margin-top: 12vw;
    opacity: 0;
    transition: opacity 1.8s ease 2.0s;
  }
  .social.is-ready { opacity: 1; }
  .social a {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    color: rgba(239, 232, 218, 0.72);
    transition: color 0.4s ease;
  }
  .social a:active { color: var(--ivory); }
  .social svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .social svg .solid { fill: currentColor; stroke: none; }

  @media (prefers-reduced-motion: reduce) {
    .word.is-ready { animation: none; }
    .word, .soon, .social { transition-duration: 0.6s; transition-delay: 0s; }
  }
</style>
</head>
<body>

<main class="stage">
  <h1 class="word" id="word">
    <span class="line">Luiza</span>
    <span class="line">Possi</span>
  </h1>
  <div class="soon" id="soon">em breve</div>
  <nav class="social" id="social" aria-label="Redes sociais"></nav>
</main>

<script>
(function () {
  'use strict';

  /* ---------- redes: preencha os endereços; vazias não aparecem ---------- */
  var LINKS = {
    instagram: 'https://instagram.com/luizapossi',
    youtube:   'https://www.youtube.com/@luizapossioficial',
    spotify:   'https://open.spotify.com/artist/46P1tvf6evAk5wk2Rg3jOq',
    tiktok:    'https://tiktok.com/@luizapossi0',
    threads:   'https://www.threads.com/@luizapossi'
  };

  var ICONS = {
    instagram:
      '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="solid" cx="17.3" cy="6.7" r="1"/></svg>',
    youtube:
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.2 8.1c.2-1.5 1.2-2.5 2.7-2.6C7.9 5.3 10 5.2 12 5.2s4.1.1 6.1.3c1.5.1 2.5 1.1 2.7 2.6.2 1.3.2 2.6.2 3.9s0 2.6-.2 3.9c-.2 1.5-1.2 2.5-2.7 2.6-2 .2-4.1.3-6.1.3s-4.1-.1-6.1-.3c-1.5-.1-2.5-1.1-2.7-2.6C3 14.6 3 13.3 3 12s0-2.6.2-3.9z"/><path class="solid" d="M10 9.2v5.6l4.6-2.8z"/></svg>',
    spotify:
      '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7.6 9.6c3-.9 6.3-.7 8.9.7"/><path d="M8.1 12.3c2.4-.7 5-.5 7.1.6"/><path d="M8.6 14.9c1.8-.5 3.7-.4 5.3.5"/></svg>',
    tiktok:
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 4v10.2a3.2 3.2 0 1 1-3.2-3.2"/><path d="M13.5 4c.3 2.6 2 4.3 4.6 4.5"/></svg>',
    threads:
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.6 11.2c-.3-3-2-4.2-3.9-4.2-2.1 0-3.4 1.1-3.9 2.4"/><path d="M15.6 11.2c1.6.6 2.5 1.7 2.5 3.1 0 2.2-2 3.6-4.3 3.6-2.5 0-4.1-1.3-4.1-3 0-1.6 1.5-2.7 3.9-2.7 1.4 0 2.5.2 3.5.6"/><path d="M15.6 11.2c.1 3.1-1.1 5-3.2 5"/><path d="M19.4 6.9C18 4.5 15.6 3.3 12.4 3.3 7.2 3.3 4.4 6.6 4.4 12s2.8 8.7 8 8.7c3.1 0 5.4-1.1 6.9-3.2"/></svg>'
  };
  var LABELS = { instagram: 'Instagram', youtube: 'YouTube', spotify: 'Spotify', tiktok: 'TikTok', threads: 'Threads' };

  var word = document.getElementById('word');
  var soon = document.getElementById('soon');
  var social = document.getElementById('social');

  Object.keys(LINKS).forEach(function (k) {
    if (!LINKS[k]) return;
    var a = document.createElement('a');
    a.href = LINKS[k];
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label', LABELS[k]);
    a.innerHTML = ICONS[k];
    social.appendChild(a);
  });

  var lines = Array.prototype.slice.call(word.querySelectorAll('.line'));

  /* as duas linhas terminam exatamente na mesma largura */
  function fit() {
    var TRIAL = 100, TRACK = 0.06;
    var W = Math.min(window.innerWidth * 0.86, 520);

    lines.forEach(function (el) {
      el.style.fontSize = TRIAL + 'px';
      el.style.letterSpacing = '0px';
      el.style.marginRight = '0px';
    });

    var nat = lines.map(function (el) { return el.getBoundingClientRect().width; });
    var gaps = lines.map(function (el) { return Math.max(1, el.textContent.trim().length - 1); });

    // corpo em que a linha mais larga cabe em W já com o tracking mínimo
    var fs = Infinity;
    nat.forEach(function (w, i) {
      fs = Math.min(fs, W / (w / TRIAL + gaps[i] * TRACK));
    });

    lines.forEach(function (el, i) {
      el.style.fontSize = fs + 'px';
      var s = (W - nat[i] * fs / TRIAL) / gaps[i];
      el.style.letterSpacing = s.toFixed(3) + 'px';
      el.style.marginRight = (-s).toFixed(3) + 'px';
    });
  }

  function init() {
    fit();
    word.classList.add('is-ready');
    soon.classList.add('is-ready');
    social.classList.add('is-ready');
  }

  var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.then(init);
  setTimeout(function () { if (!word.classList.contains('is-ready')) init(); }, 2200);

  var t = null;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(fit, 120); });
  window.addEventListener('orientationchange', function () { clearTimeout(t); t = setTimeout(fit, 120); });
})();
</script>
</body>
</html>
